name: Private Attendance CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 25, cache: npm }
      - run: npm ci
      - run: npm run compact --workspace=@midnight-ntwrk/attendance-contract
      - run: npm run build --workspace=@midnight-ntwrk/attendance-contract
      - run: npm run typecheck --workspace=@midnight-ntwrk/attendance-ui
      - run: npm run build --workspace=@midnight-ntwrk/attendance-ui
